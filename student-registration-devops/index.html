<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Student Registration</h1>

    <p class="subtitle">
        Enter your details to complete registration.
    </p>


    <form id="registrationForm">

        <!-- Full Name -->
        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                minlength="2"
                required
            >

            <small id="nameError"></small>

        </div>


        <!-- Email -->
        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                required
            >

            <small id="emailError"></small>

        </div>


        <!-- Phone -->
        <div class="form-group">

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="10-digit phone number"
                maxlength="10"
                required
            >

            <small id="phoneError"></small>

        </div>


        <!-- Date of Birth -->
        <div class="form-group">

            <label for="dob">
                Date of Birth
            </label>

            <input
                type="date"
                id="dob"
                name="dob"
                required
            >

            <small id="dobError"></small>

        </div>


        <!-- Gender -->
        <div class="form-group">

            <label for="gender">
                Gender
            </label>

            <select
                id="gender"
                name="gender"
                required
            >

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

            <small id="genderError"></small>

        </div>


        <!-- Course -->
        <div class="form-group">

            <label for="course">
                Course
            </label>

            <select
                id="course"
                name="course"
                required
            >

                <option value="">
                    Select your course
                </option>

                <option value="B.Tech">
                    B.Tech
                </option>

                <option value="BCA">
                    BCA
                </option>

                <option value="MCA">
                    MCA
                </option>

                <option value="BBA">
                    BBA
                </option>

            </select>

            <small id="courseError"></small>

        </div>


        <!-- Branch -->
        <div class="form-group">

            <label for="branch">
                Branch / Specialization
            </label>

            <select
                id="branch"
                name="branch"
                required
            >

                <option value="">
                    Select branch
                </option>

                <option value="Computer Science Engineering">
                    Computer Science Engineering
                </option>

                <option value="Data Science">
                    Data Science
                </option>

                <option value="Artificial Intelligence">
                    Artificial Intelligence
                </option>

                <option value="Information Technology">
                    Information Technology
                </option>

                <option value="Electronics">
                    Electronics
                </option>

            </select>

            <small id="branchError"></small>

        </div>


        <!-- Academic Year -->
        <div class="form-group">

            <label for="year">
                Academic Year
            </label>

            <select
                id="year"
                name="year"
                required
            >

                <option value="">
                    Select year
                </option>

                <option value="1st Year">
                    1st Year
                </option>

                <option value="2nd Year">
                    2nd Year
                </option>

                <option value="3rd Year">
                    3rd Year
                </option>

                <option value="4th Year">
                    4th Year
                </option>

            </select>

            <small id="yearError"></small>

        </div>


        <!-- Address -->
        <div class="form-group">

            <label for="address">
                Address
            </label>

            <textarea
                id="address"
                name="address"
                placeholder="Enter your complete address"
                minlength="10"
                required
            ></textarea>

            <small id="addressError"></small>

        </div>


        <!-- City -->
        <div class="form-group">

            <label for="city">
                City
            </label>

            <input
                type="text"
                id="city"
                name="city"
                placeholder="Enter your city"
                required
            >

            <small id="cityError"></small>

        </div>


        <!-- State -->
        <div class="form-group">

            <label for="state">
                State
            </label>

            <input
                type="text"
                id="state"
                name="state"
                placeholder="Enter your state"
                required
            >

            <small id="stateError"></small>

        </div>


        <!-- Pincode -->
        <div class="form-group">

            <label for="pincode">
                Pincode
            </label>

            <input
                type="text"
                id="pincode"
                name="pincode"
                placeholder="6-digit pincode"
                maxlength="6"
                required
            >

            <small id="pincodeError"></small>

        </div>


        <!-- Submit -->
        <button type="submit">
            Register Student
        </button>

    </form>


    <!-- Registration Result -->

    <div
        id="registrationResult"
        class="registration-result"
        hidden
    >

        <h2>✓ Registration Successful</h2>

        <p class="result-subtitle">
            Student registration has been completed successfully.
        </p>


        <div class="details-card">

            <h3>Registered Student Details</h3>


            <div class="detail-row">
                <strong>Full Name:</strong>
                <span id="resultName"></span>
            </div>


            <div class="detail-row">
                <strong>Email:</strong>
                <span id="resultEmail"></span>
            </div>


            <div class="detail-row">
                <strong>Phone:</strong>
                <span id="resultPhone"></span>
            </div>


            <div class="detail-row">
                <strong>Date of Birth:</strong>
                <span id="resultDob"></span>
            </div>


            <div class="detail-row">
                <strong>Gender:</strong>
                <span id="resultGender"></span>
            </div>


            <div class="detail-row">
                <strong>Course:</strong>
                <span id="resultCourse"></span>
            </div>


            <div class="detail-row">
                <strong>Branch:</strong>
                <span id="resultBranch"></span>
            </div>


            <div class="detail-row">
                <strong>Academic Year:</strong>
                <span id="resultYear"></span>
            </div>


            <div class="detail-row">
                <strong>Address:</strong>
                <span id="resultAddress"></span>
            </div>


            <div class="detail-row">
                <strong>City:</strong>
                <span id="resultCity"></span>
            </div>


            <div class="detail-row">
                <strong>State:</strong>
                <span id="resultState"></span>
            </div>


            <div class="detail-row">
                <strong>Pincode:</strong>
                <span id="resultPincode"></span>
            </div>

        </div>

    </div>

</div>


<script src="validation.js"></script>

</body>

</html>
